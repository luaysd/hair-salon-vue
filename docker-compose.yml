version: '3.8'

services:
  vue-app:
    image: ghcr.io/luaysd/vue-app:latest
    ports:
      - "8090:80"
    restart: unless-stopped
  watchtower:
    image: containrrr/watchtower
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    command: --label-enable --cleanup
labels:
  - "com.centurylinklabs.watchtower.enable=true"