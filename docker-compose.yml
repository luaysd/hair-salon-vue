# version: '3.8'

services:
  web:
    image: your-vue-image:latest
    ports:
      - target: 80         # The port your Vue app listens to inside the container
        published: 8090    # The port you want to expose on the host
        protocol: tcp
        mode: host
    deploy:
      replicas: 1
      restart_policy:
        condition: any
    nginx:
    image: nginx:alpine
    container_name: nginx-app
    volumes:
    - ./nginx/default.conf:/etc/nginx/conf.d/default.conf